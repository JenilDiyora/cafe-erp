<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Table Stand QR - {{ table.table_number }} | Mitra Cafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #f3f4f6;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
    }
    .print-card {
      max-width: 420px;
      margin: 0 auto;
      background: #ffffff;
      border: 3px solid #2d1810;
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .cafe-title {
      font-size: 28px;
      font-weight: 800;
      color: #2d1810;
      margin-bottom: 4px;
    }
    .cafe-sub {
      color: #786558;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .qr-frame {
      display: inline-block;
      padding: 16px;
      background: #ffffff;
      border: 2px dashed #e5a755;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    .qr-frame img {
      width: 240px;
      height: 240px;
      display: block;
    }
    .table-badge {
      display: inline-block;
      background: #2d1810;
      color: #e5a755;
      font-size: 22px;
      font-weight: 800;
      padding: 8px 24px;
      border-radius: 50px;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .scan-instruction {
      font-size: 15px;
      color: #4a3b32;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .wifi-hint {
      font-size: 12px;
      color: #8c786c;
      margin-top: 20px;
      border-top: 1px solid #f0e4d8;
      padding-top: 15px;
    }
    .no-print-bar {
      max-width: 420px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    @media print {
      body {
        background: transparent;
        padding: 0;
      }
      .no-print-bar {
        display: none !important;
      }
      .print-card {
        border: 2px solid #000;
        box-shadow: none;
        max-width: 100%;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>

  <div class="no-print-bar">
    <a href="/admin/tables/cafetable/" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left"></i> Back to Admin
    </a>
    <button onclick="window.print()" class="btn btn-dark btn-sm">
      <i class="bi bi-printer-fill me-1"></i> Print Stand
    </button>
  </div>

  <div class="print-card">
    <div class="cafe-title">☕ Mitra Cafe</div>
    <div class="cafe-sub">Specialty Coffee & Kitchen</div>

    <div class="table-badge">{{ table.table_number }}</div>

    <div class="qr-frame">
      {% if table.qr_image %}
        <img src="{{ table.qr_image.url }}" alt="QR Code for {{ table.table_number }}">
      {% else %}
        <p class="text-danger small">QR not generated yet</p>
      {% endif %}
    </div>

    <div class="scan-instruction">
      <i class="bi bi-phone me-1"></i> Scan to View Menu & Order
    </div>
    <div class="small text-muted">
      {{ table.location }} &bull; Seats {{ table.capacity }}
    </div>

    <div class="wifi-hint">
      <strong>Mitra Cafe Guest Wi-Fi:</strong> MitraCafe_5G<br>
      Chhaprabhatha, Surat &bull; +91 7405401350
    </div>
  </div>

</body>
</html>
