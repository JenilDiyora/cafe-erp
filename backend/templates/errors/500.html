{% extends "base.html" %}

{% block title %}500 - Server Error | Mitra Cafe{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="brand-icon mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2.5rem; background: linear-gradient(135deg, #c53030, #742a2a);">
        <i class="bi bi-exclamation-triangle-fill text-white"></i>
      </div>
      <h1 class="display-3 fw-bold text-danger mb-2">500</h1>
      <h2 class="h3 mb-3">Something Went Wrong</h2>
      <p class="lead text-muted mb-4">
        Our barista machines hit an unexpected steam hiccup. Please try again later.
      </p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{{ url('core:home') }}" class="btn btn-cafe-primary btn-lg">
          <i class="bi bi-house-door-fill"></i> Back to Home
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
