{% extends "base.html" %}

{% block title %}404 - Page Not Found | Mitra Cafe{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="brand-icon mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2.5rem;">
        <i class="bi bi-cup-hot"></i>
      </div>
      <h1 class="display-3 fw-bold text-primary mb-2">404</h1>
      <h2 class="h3 mb-3">Page Not Found</h2>
      <p class="lead text-muted mb-4">
        The page you're looking for doesn't exist, was moved, or had its brew changed.
      </p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{{ url('core:home') }}" class="btn btn-cafe-primary btn-lg">
          <i class="bi bi-house-door-fill"></i> Back to Home
        </a>
        <a href="{{ url('menu:list') }}" class="btn btn-cafe-outline btn-lg">
          <i class="bi bi-book-half"></i> Browse Menu
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
