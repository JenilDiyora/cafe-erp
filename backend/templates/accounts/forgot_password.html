{% extends "base.html" %}

{% block title %}Forgot Password | Mitra Cafe{% endblock %}

{% block content %}
<section class="py-5" style="min-height: 80vh; display: flex; align-items: center;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.8rem;">
              <i class="bi bi-key-fill"></i>
            </div>
            <h1 class="h3 fw-bold mb-1">Reset Password</h1>
            <p class="text-muted small">Enter your email and we'll send a 6-digit OTP code to reset your password.</p>
          </div>

          <form method="POST" action="{{ url('accounts:forgot_password') }}">
            {{ csrf_input }}

            <div class="mb-4">
              <label class="form-label small fw-semibold">Registered Email Address</label>
              {{ form.email }}
            </div>

            <button type="submit" class="btn btn-cafe-primary w-100 py-2 justify-content-center">
              <i class="bi bi-send-fill me-1"></i> Send Reset Code
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <a href="{{ url('accounts:login') }}" class="small text-muted text-decoration-none">
              <i class="bi bi-arrow-left me-1"></i> Back to Login
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
{% endblock %}
