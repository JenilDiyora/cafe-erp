services:
  - type: web
    name: mitra-cafe
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir backend config.wsgi:application"
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        fromDatabase:
          name: cafe-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USE_SSL
        value: "True"
      - key: EMAIL_USE_TLS
        value: "False"
      - key: EMAIL_HOST_USER
        value: moviesmovie920@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Mitra Cafe <moviesmovie920@gmail.com>"

databases:
  - name: cafe-db
    databaseName: cafe_db
    user: postgres
    plan: free

